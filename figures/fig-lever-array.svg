<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="520" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#e8e8e8" font-size="14" text-anchor="middle" font-weight="bold">Third-Class Lever Dynamics: Tool-Specific Attractors and Deeper Commonality</text>
  
  <!-- PANEL 1: 16oz vertical form -->
  <rect x="20" y="50" width="175" height="190" rx="6" fill="#1e2a45" stroke="#334" stroke-width="1"/>
  <text x="107" y="70" fill="#4ecdc4" font-size="10" text-anchor="middle" font-weight="bold">A. 16oz Hammer</text>
  <text x="107" y="83" fill="#4ecdc4" font-size="8" text-anchor="middle" opacity="0.7">Vertical form, below waist</text>
  
  <!-- Axes -->
  <line x1="45" y1="220" x2="180" y2="220" stroke="#444" stroke-width="0.5"/>
  <line x1="45" y1="100" x2="45" y2="220" stroke="#444" stroke-width="0.5"/>
  <text x="112" y="235" fill="#666" font-size="7" text-anchor="middle">Handle length</text>
  <text x="32" y="160" fill="#666" font-size="7" text-anchor="middle" transform="rotate(-90,32,160)">Mass</text>
  
  <!-- Tight spiral attractor (compact wrist-elbow) -->
  <path d="M100,170 Q110,155 115,160 Q120,170 110,175 Q100,165 108,155 Q118,148 120,158 Q115,168 105,165" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.8"/>
  <circle cx="110" cy="162" r="3" fill="#4ecdc4" opacity="0.5"/>
  
  <!-- Kinetic chain indicator -->
  <rect x="50" y="92" width="60" height="12" rx="6" fill="#4ecdc4" opacity="0.15"/>
  <rect x="50" y="92" width="25" height="12" rx="6" fill="#4ecdc4" opacity="0.4"/>
  <text x="130" y="101" fill="#4ecdc4" font-size="7" opacity="0.6">Wrist-elbow</text>
  
  <!-- PANEL 2: 16oz decking -->
  <rect x="210" y="50" width="175" height="190" rx="6" fill="#1e2a45" stroke="#334" stroke-width="1"/>
  <text x="297" y="70" fill="#e94560" font-size="10" text-anchor="middle" font-weight="bold">B. 16oz Hammer</text>
  <text x="297" y="83" fill="#e94560" font-size="8" text-anchor="middle" opacity="0.7">Decking, 4-point stance</text>
  
  <line x1="235" y1="220" x2="370" y2="220" stroke="#444" stroke-width="0.5"/>
  <line x1="235" y1="100" x2="235" y2="220" stroke="#444" stroke-width="0.5"/>
  <text x="302" y="235" fill="#666" font-size="7" text-anchor="middle">Handle length</text>
  
  <!-- Wider attractor (shoulder recruits) -->
  <path d="M285,175 Q300,150 310,160 Q315,175 300,180 Q285,170 295,150 Q310,142 318,158 Q310,172 295,170" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.8"/>
  <circle cx="300" cy="163" r="3" fill="#e94560" opacity="0.5"/>
  
  <rect x="240" y="92" width="60" height="12" rx="6" fill="#e94560" opacity="0.15"/>
  <rect x="240" y="92" width="38" height="12" rx="6" fill="#e94560" opacity="0.4"/>
  <text x="320" y="101" fill="#e94560" font-size="7" opacity="0.6">Elbow-shoulder</text>
  
  <!-- PANEL 3: 3lb blacksmith -->
  <rect x="400" y="50" width="175" height="190" rx="6" fill="#1e2a45" stroke="#334" stroke-width="1"/>
  <text x="487" y="70" fill="#f0c040" font-size="10" text-anchor="middle" font-weight="bold">C. 3lb Blacksmith</text>
  <text x="487" y="83" fill="#f0c040" font-size="8" text-anchor="middle" opacity="0.7">10.5" handle, lift and drop</text>
  
  <line x1="425" y1="220" x2="560" y2="220" stroke="#444" stroke-width="0.5"/>
  <line x1="425" y1="100" x2="425" y2="220" stroke="#444" stroke-width="0.5"/>
  <text x="492" y="235" fill="#666" font-size="7" text-anchor="middle">Handle length</text>
  
  <!-- Different attractor shape (ground-up kinetic chain) -->
  <path d="M475,180 Q495,148 505,162 Q508,180 492,185 Q475,172 488,145 Q503,138 510,158 Q502,175 485,172" fill="none" stroke="#f0c040" stroke-width="1.5" opacity="0.8"/>
  <circle cx="492" cy="165" r="3" fill="#f0c040" opacity="0.5"/>
  
  <rect x="430" y="92" width="60" height="12" rx="6" fill="#f0c040" opacity="0.15"/>
  <rect x="430" y="92" width="48" height="12" rx="6" fill="#f0c040" opacity="0.4"/>
  <text x="510" y="101" fill="#f0c040" font-size="7" opacity="0.6">Feet-hips-shoulder</text>
  
  <!-- PANEL 4: 9lb maul -->
  <rect x="590" y="50" width="190" height="190" rx="6" fill="#1e2a45" stroke="#334" stroke-width="1"/>
  <text x="685" y="70" fill="#a29bfe" font-size="10" text-anchor="middle" font-weight="bold">D. 9lb Maul</text>
  <text x="685" y="83" fill="#a29bfe" font-size="8" text-anchor="middle" opacity="0.7">36" handle, overhead splitting</text>
  
  <line x1="615" y1="220" x2="765" y2="220" stroke="#444" stroke-width="0.5"/>
  <line x1="615" y1="100" x2="615" y2="220" stroke="#444" stroke-width="0.5"/>
  <text x="690" y="235" fill="#666" font-size="7" text-anchor="middle">Handle length</text>
  
  <!-- Large, gravitational attractor -->
  <path d="M670,185 Q700,140 715,160 Q720,185 695,192 Q670,178 690,135 Q712,125 722,155 Q710,180 685,178" fill="none" stroke="#a29bfe" stroke-width="1.5" opacity="0.8"/>
  <circle cx="695" cy="168" r="3" fill="#a29bfe" opacity="0.5"/>
  
  <rect x="620" y="92" width="60" height="12" rx="6" fill="#a29bfe" opacity="0.15"/>
  <rect x="620" y="92" width="58" height="12" rx="6" fill="#a29bfe" opacity="0.4"/>
  <text x="700" y="101" fill="#a29bfe" font-size="7" opacity="0.6">Full body + gravity</text>
  
  <!-- PANEL 5: Deeper commonality attractor -->
  <rect x="150" y="280" width="500" height="210" rx="8" fill="#1a2440" stroke="#ffd700" stroke-width="1" opacity="0.8"/>
  <text x="400" y="302" fill="#ffd700" font-size="12" text-anchor="middle" font-weight="bold">E. Deeper Attractor: Third-Class Lever Dynamics</text>
  <text x="400" y="318" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7">Generalized knowledge capturing tool-specific trajectories</text>
  
  <!-- Axes for combined space -->
  <line x1="190" y1="465" x2="610" y2="465" stroke="#555" stroke-width="0.5"/>
  <line x1="190" y1="335" x2="190" y2="465" stroke="#555" stroke-width="0.5"/>
  <text x="400" y="480" fill="#888" font-size="8" text-anchor="middle">Handle length / Lever arm ratio</text>
  <text x="172" y="400" fill="#888" font-size="8" text-anchor="middle" transform="rotate(-90,172,400)">Head mass / Kinetic chain recruitment</text>
  
  <!-- Four tool-specific trajectories converging toward deep basin -->
  <path d="M230,430 Q270,420 310,400 Q350,385 390,380 Q420,378 440,380" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.5"/>
  <path d="M250,440 Q290,425 330,405 Q360,390 395,383 Q425,380 445,382" fill="none" stroke="#e94560" stroke-width="1.2" opacity="0.5"/>
  <path d="M320,350 Q360,365 400,378 Q430,382 450,384" fill="none" stroke="#f0c040" stroke-width="1.2" opacity="0.5"/>
  <path d="M520,345 Q490,365 460,378 Q445,382 440,384" fill="none" stroke="#a29bfe" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Deep basin -->
  <ellipse cx="440" cy="395" rx="45" ry="25" fill="#ffd700" opacity="0.06" stroke="#ffd700" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <ellipse cx="440" cy="400" rx="25" ry="15" fill="#ffd700" opacity="0.1"/>
  
  <!-- Labels for converging trajectories -->
  <circle cx="230" cy="430" r="3" fill="#4ecdc4"/>
  <text x="218" y="445" fill="#4ecdc4" font-size="7">A</text>
  <circle cx="250" cy="440" r="3" fill="#e94560"/>
  <text x="238" y="455" fill="#e94560" font-size="7">B</text>
  <circle cx="320" cy="350" r="3" fill="#f0c040"/>
  <text x="310" y="345" fill="#f0c040" font-size="7">C</text>
  <circle cx="520" cy="345" r="3" fill="#a29bfe"/>
  <text x="528" y="345" fill="#a29bfe" font-size="7">D</text>
  
  <!-- Deep basin label -->
  <text x="440" y="440" fill="#ffd700" font-size="8" text-anchor="middle" opacity="0.8">Proximal-to-distal principle</text>
  <text x="440" y="452" fill="#ffd700" font-size="8" text-anchor="middle" opacity="0.8">Gravity as co-contributor</text>
  <text x="440" y="464" fill="#ffd700" font-size="8" text-anchor="middle" opacity="0.8">Tool-as-body-extension</text>
  
  <!-- Arrows connecting panels to bottom -->
  <line x1="107" y1="240" x2="250" y2="280" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="297" y1="240" x2="320" y2="280" stroke="#e94560" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="487" y1="240" x2="440" y2="280" stroke="#f0c040" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="685" y1="240" x2="550" y2="280" stroke="#a29bfe" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
</svg>
