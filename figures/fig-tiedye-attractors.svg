<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="420" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="400" y="32" fill="#e8e8e8" font-size="15" text-anchor="middle" font-weight="bold">Attractor Landscapes in Tie Dye: Novice vs. Experienced Artist</text>
  
  <!-- LEFT PANEL: Novice -->
  <text x="200" y="60" fill="#ccc" font-size="13" text-anchor="middle" font-weight="bold">A. Novice</text>
  <text x="200" y="76" fill="#888" font-size="10" text-anchor="middle" font-style="italic">Shallow basins, wide trajectory dispersion</text>
  
  <!-- Landscape surface (shallow, wide) -->
  <path d="M40,250 Q80,240 120,245 Q160,255 200,248 Q240,240 280,246 Q320,255 360,250" fill="none" stroke="#666" stroke-width="1.5"/>
  
  <!-- Shallow basin lines -->
  <path d="M90,245 Q120,255 150,245" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M170,250 Q200,258 230,248" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M260,248 Q290,258 320,250" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2,3"/>
  
  <!-- Scattered trajectories (wide dispersion) -->
  <path d="M60,160 Q90,180 130,200 Q170,185 210,210 Q240,195 270,220 Q310,200 340,190" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <path d="M70,130 Q100,170 140,150 Q180,210 200,170 Q250,230 290,180 Q320,210 350,170" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
  <path d="M55,190 Q95,145 125,190 Q165,160 195,195 Q235,155 265,200 Q305,165 345,205" fill="none" stroke="#c44569" stroke-width="1" opacity="0.4"/>
  <path d="M75,175 Q105,200 145,165 Q175,195 215,155 Q245,205 285,165 Q315,195 340,175" fill="none" stroke="#f78fb3" stroke-width="1" opacity="0.3"/>
  <path d="M50,155 Q90,195 120,170 Q160,200 200,175 Q240,210 280,175 Q310,200 350,185" fill="none" stroke="#e66767" stroke-width="1" opacity="0.3"/>
  
  <!-- Labels -->
  <text x="200" y="285" fill="#888" font-size="10" text-anchor="middle">Fold topology / Constraint space</text>
  <text x="15" y="190" fill="#888" font-size="9" text-anchor="middle" transform="rotate(-90,15,190)">Dye trajectory</text>
  
  <!-- Outcome annotation -->
  <rect x="60" y="305" width="280" height="55" rx="4" fill="#e94560" opacity="0.08" stroke="#e94560" stroke-width="0.5" opacity="0.3"/>
  <text x="200" y="322" fill="#e94560" font-size="10" text-anchor="middle">High variability in outcomes</text>
  <text x="200" y="336" fill="#e94560" font-size="9" text-anchor="middle" opacity="0.7">Predictions unreliable; each piece a surprise</text>
  <text x="200" y="350" fill="#e94560" font-size="9" text-anchor="middle" opacity="0.7">Noise accepted as artistic expression</text>
  
  <!-- RIGHT PANEL: Experienced Artist -->
  <text x="600" y="60" fill="#ccc" font-size="13" text-anchor="middle" font-weight="bold">B. Experienced Artist</text>
  <text x="600" y="76" fill="#888" font-size="10" text-anchor="middle" font-style="italic">Deep basins, tight trajectory convergence</text>
  
  <!-- Landscape surface (deep basins) -->
  <path d="M440,250 Q470,245 490,230 Q510,260 530,230 Q540,248 560,250 Q580,245 600,220 Q620,260 640,220 Q660,248 690,230 Q710,260 730,235 Q745,248 760,250" fill="none" stroke="#666" stroke-width="1.5"/>
  
  <!-- Deep basin emphasis -->
  <path d="M485,238 Q510,268 535,238" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M590,230 Q620,270 650,230" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2,3"/>
  <path d="M685,238 Q710,268 735,238" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="2,3"/>
  
  <!-- Tight trajectory bundles -->
  <!-- Basin 1 -->
  <path d="M460,170 Q480,190 505,210 Q515,200 510,215" fill="none" stroke="#ffd700" stroke-width="1.2" opacity="0.6"/>
  <path d="M465,165 Q485,185 508,205 Q518,198 512,212" fill="none" stroke="#f0c040" stroke-width="1.2" opacity="0.5"/>
  <path d="M458,175 Q478,192 503,212 Q512,205 508,218" fill="none" stroke="#e8b830" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Basin 2 -->
  <path d="M565,155 Q590,180 615,210 Q625,200 620,215" fill="none" stroke="#ffd700" stroke-width="1.2" opacity="0.6"/>
  <path d="M568,150 Q593,178 618,205 Q628,198 623,212" fill="none" stroke="#f0c040" stroke-width="1.2" opacity="0.5"/>
  <path d="M562,158 Q588,182 612,212 Q622,205 618,218" fill="none" stroke="#e8b830" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Basin 3 -->
  <path d="M670,165 Q695,190 715,210 Q722,202 718,215" fill="none" stroke="#ffd700" stroke-width="1.2" opacity="0.6"/>
  <path d="M673,160 Q698,188 718,205 Q725,198 720,212" fill="none" stroke="#f0c040" stroke-width="1.2" opacity="0.5"/>
  <path d="M667,170 Q692,192 712,212 Q720,205 716,218" fill="none" stroke="#e8b830" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Labels -->
  <text x="600" y="285" fill="#888" font-size="10" text-anchor="middle">Fold topology / Constraint space</text>
  
  <!-- Outcome annotation -->
  <rect x="460" y="305" width="280" height="55" rx="4" fill="#ffd700" opacity="0.08" stroke="#ffd700" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="322" fill="#ffd700" font-size="10" text-anchor="middle">Reproducible outcomes within basins</text>
  <text x="600" y="336" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7">Predictions accurate; signature style emerges</text>
  <text x="600" y="350" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7">No two pieces identical (sensitivity to initial conditions)</text>
  
  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="370" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Bottom note -->
  <text x="400" y="400" fill="#777" font-size="9" text-anchor="middle" font-style="italic">Both systems: same dye chemistry, same capillary physics. Difference is in the depth of attractor basins formed through experience.</text>
</svg>
