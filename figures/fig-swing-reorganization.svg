<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="varGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#e94560;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg1)"/>
  
  <!-- Title -->
  <text x="400" y="35" fill="#e8e8e8" font-size="16" text-anchor="middle" font-weight="bold">Swing Reorganization: Shoulder-Drive to Wrist-Whip Attractor</text>
  
  <!-- Time axis -->
  <line x1="80" y1="340" x2="740" y2="340" stroke="#555" stroke-width="1"/>
  <text x="410" y="375" fill="#999" font-size="12" text-anchor="middle">Time (weeks of practice)</text>
  
  <!-- Y axis -->
  <line x1="80" y1="60" x2="80" y2="340" stroke="#555" stroke-width="1"/>
  <text x="30" y="200" fill="#999" font-size="11" text-anchor="middle" transform="rotate(-90,30,200)">System State</text>
  
  <!-- Variability band (widening at transition) -->
  <path d="M80,180 Q150,175 200,170 Q250,160 300,140 Q340,100 370,70 Q400,100 430,140 Q460,160 500,170 Q560,175 620,178 Q680,179 740,180" fill="none" stroke="url(#varGrad)" stroke-width="0" opacity="0"/>
  
  <!-- Upper variability envelope -->
  <path d="M80,175 Q150,172 200,168 Q250,155 300,120 Q340,70 370,55 Q400,70 430,120 Q460,160 500,172 Q560,178 620,182 Q680,184 740,185" fill="none" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Lower variability envelope -->
  <path d="M80,195 Q150,198 200,202 Q250,215 300,250 Q340,300 370,315 Q400,300 430,250 Q460,210 500,198 Q560,192 620,188 Q680,186 740,185" fill="none" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Variability fill -->
  <path d="M80,175 Q150,172 200,168 Q250,155 300,120 Q340,70 370,55 Q400,70 430,120 Q460,160 500,172 Q560,178 620,182 Q680,184 740,185 L740,185 Q680,186 620,188 Q560,192 500,198 Q460,210 430,250 Q400,300 370,315 Q340,300 300,250 Q250,215 200,202 Q150,198 80,195 Z" fill="#e94560" opacity="0.08"/>
  
  <!-- Old attractor (shoulder swing) - stable then dissolving -->
  <path d="M80,185 Q120,184 160,185 Q200,186 240,188 Q280,195 310,210 Q330,230 345,260" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.8"/>
  <circle cx="185" cy="185" r="4" fill="#4ecdc4" opacity="0.6"/>
  <text x="185" y="168" fill="#4ecdc4" font-size="10" text-anchor="middle" opacity="0.8">Shoulder-drive attractor</text>
  
  <!-- Transition zone -->
  <rect x="310" y="50" width="120" height="295" fill="#e94560" opacity="0.04" rx="5"/>
  <text x="370" y="330" fill="#e94560" font-size="10" text-anchor="middle" font-style="italic">Critical instability</text>
  
  <!-- Scattered points in transition (representing high variability) -->
  <circle cx="320" cy="130" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="335" cy="260" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="345" cy="100" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="355" cy="280" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="365" cy="85" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="370" cy="290" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="380" cy="110" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="390" cy="240" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="400" cy="150" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="410" cy="210" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="350" cy="190" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="375" cy="170" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="395" cy="270" r="2" fill="#e94560" opacity="0.5"/>
  
  <!-- New attractor (wrist-whip) - forming then stabilizing -->
  <path d="M425,210 Q450,195 480,188 Q520,184 560,183 Q600,182 640,182 Q680,182 720,182 L740,182" fill="none" stroke="#ffd700" stroke-width="2.5" opacity="0.9"/>
  <circle cx="640" cy="182" r="4" fill="#ffd700" opacity="0.6"/>
  <text x="640" y="168" fill="#ffd700" font-size="10" text-anchor="middle" opacity="0.8">Wrist-whip attractor</text>
  
  <!-- Annotations -->
  <text x="130" y="80" fill="#4ecdc4" font-size="9" opacity="0.7">Low variability</text>
  <text x="130" y="92" fill="#4ecdc4" font-size="9" opacity="0.7">High fatigue</text>
  <text x="130" y="104" fill="#4ecdc4" font-size="9" opacity="0.7">Smashed thumbs</text>
  
  <text x="600" y="80" fill="#ffd700" font-size="9" opacity="0.7">Low variability</text>
  <text x="600" y="92" fill="#ffd700" font-size="9" opacity="0.7">Mechanical advantage</text>
  <text x="600" y="104" fill="#ffd700" font-size="9" opacity="0.7">Precision + efficiency</text>
  
  <!-- Legend -->
  <line x1="85" y1="55" x2="105" y2="55" stroke="#4ecdc4" stroke-width="2"/>
  <text x="110" y="59" fill="#4ecdc4" font-size="9">Old attractor</text>
  <line x1="200" y1="55" x2="220" y2="55" stroke="#ffd700" stroke-width="2"/>
  <text x="225" y="59" fill="#ffd700" font-size="9">New attractor</text>
  <line x1="320" y1="55" x2="340" y2="55" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="345" y="59" fill="#e94560" font-size="9">Variability envelope</text>
</svg>
