    <circle cx="125" cy="124" r="3"/><circle cx="140" cy="124" r="3"/><circle cx="160" cy="124" r="3"/>
    <circle cx="200" cy="124" r="3"/><circle cx="215" cy="124" r="3"/><circle cx="235" cy="124" r="3"/><circle cx="255" cy="124" r="3"/>
    <circle cx="290" cy="124" r="3"/><circle cx="310" cy="124" r="3"/><circle cx="330" cy="124" r="3"/><circle cx="350" cy="124" r="3"/>
    <circle cx="380" cy="124" r="3"/><circle cx="400" cy="124" r="3"/><circle cx="420" cy="124" r="3"/><circle cx="440" cy="124" r="3"/><circle cx="460" cy="124" r="3"/><circle cx="480" cy="124" r="3"/>
    <circle cx="510" cy="124" r="3"/><circle cx="530" cy="124" r="3"/><circle cx="545" cy="124" r="3"/><circle cx="560" cy="124" r="3"/><circle cx="575" cy="124" r="3"/>
  </g>
  <!-- Sample arcs - challenges (red) -->
  <path d="M 200 124 Q 145 60 85 124" fill="none" stroke="#e07a5f" stroke-width="1.2" opacity="0.35"/>
  <path d="M 235 124 Q 175 50 125 124" fill="none" stroke="#e07a5f" stroke-width="1.2" opacity="0.35"/>
  <path d="M 200 124 Q 120 35 40 124" fill="none" stroke="#e07a5f" stroke-width="1.2" opacity="0.3"/>
  <!-- extends (green) -->
  <path d="M 290 124 Q 260 75 235 124" fill="none" stroke="#81b29a" stroke-width="1.2" opacity="0.35"/>
  <path d="M 350 124 Q 290 50 215 124" fill="none" stroke="#81b29a" stroke-width="1.2" opacity="0.3"/>
  <path d="M 310 124 Q 265 65 200 124" fill="none" stroke="#81b29a" stroke-width="1.2" opacity="0.35"/>
  <path d="M 575 124 Q 400 25 215 124" fill="none" stroke="#81b29a" stroke-width="1.2" opacity="0.25"/>
  <!-- instantiates (gold) -->
  <path d="M 380 124 Q 335 55 290 124" fill="none" stroke="#f2cc8f" stroke-width="1.2" opacity="0.35"/>
  <path d="M 440 124 Q 380 40 310 124" fill="none" stroke="#f2cc8f" stroke-width="1.2" opacity="0.3"/>
  <path d="M 460 124 Q 375 30 290 124" fill="none" stroke="#f2cc8f" stroke-width="1.2" opacity="0.3"/>
  <path d="M 545 124 Q 490 45 440 124" fill="none" stroke="#f2cc8f" stroke-width="1.2" opacity="0.35"/>
