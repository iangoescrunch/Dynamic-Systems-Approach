  <path d="M 560 124 Q 425 25 310 124" fill="none" stroke="#8ecae6" stroke-width="1.2" opacity="0.25"/>
  <path d="M 575 124 Q 480 30 380 124" fill="none" stroke="#8ecae6" stroke-width="1.2" opacity="0.3"/>
