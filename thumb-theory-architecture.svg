  <text x="300" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#e8e4d8" font-weight="300" letter-spacing="3">THEORY ARCHITECTURE</text>
  <text x="300" y="48" text-anchor="middle" font-family="monospace" font-size="8" fill="#666" letter-spacing="2">CHAPTERS 1–6 · 26 CONCEPTS · 33 CONNECTIONS</text>
  <!-- Legend -->
  <g transform="translate(100, 220)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#e07a5f" stroke-width="2"/><text x="22" y="3" font-family="monospace" font-size="7" fill="#888">CHALLENGES</text>
    <line x1="110" y1="0" x2="126" y2="0" stroke="#81b29a" stroke-width="2"/><text x="132" y="3" font-family="monospace" font-size="7" fill="#888">EXTENDS</text>
    <line x1="205" y1="0" x2="221" y2="0" stroke="#f2cc8f" stroke-width="2"/><text x="227" y="3" font-family="monospace" font-size="7" fill="#888">INSTANTIATES</text>
    <line x1="320" y1="0" x2="336" y2="0" stroke="#8ecae6" stroke-width="2"/><text x="342" y="3" font-family="monospace" font-size="7" fill="#888">CROSS-CUTTING</text>
  </g>
  <!-- Chapter labels -->
  <text x="58" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#444">Ch 1</text>
  <text x="140" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#444">Ch 2</text>
  <text x="225" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#444">Ch 3</text>
  <text x="320" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#444">Ch 4</text>
  <text x="430" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#444">Ch 5</text>
  <text x="540" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#444">Ch 6</text>
