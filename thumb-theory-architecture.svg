  <rect x="120" y="120" width="60" height="8" rx="2" fill="#5c4a5e" opacity="0.25"/>
  <rect x="190" y="120" width="80" height="8" rx="2" fill="#3d5a4e" opacity="0.25"/>
  <rect x="280" y="120" width="80" height="8" rx="2" fill="#4a5a3d" opacity="0.25"/>
  <rect x="370" y="120" width="120" height="8" rx="2" fill="#3d4f6b" opacity="0.25"/>
  <rect x="500" y="120" width="80" height="8" rx="2" fill="#6b5a3d" opacity="0.25"/>
  <!-- Node dots -->
  <g fill="#888" opacity="0.6">
