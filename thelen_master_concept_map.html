  {source:"c3_control_param",target:"c3_phase_shift",type:"informs",label:"Continuous scaling → discontinuous shift"},
  {source:"c3_phase_shift",target:"c4_landscape",type:"informs",label:"Landscape reshapes at transitions"},
  {source:"c4_landscape",target:"c4_soft_assembly",type:"informs",label:"Assembly depends on current landscape"},
  {source:"c5_tngs",target:"c5_reentry",type:"informs",label:"Reentry is binding mechanism of TNGS"},
  {source:"c5_tngs",target:"c5_degeneracy",type:"informs",label:"Degeneracy ensures robustness in selection"},
  {source:"c5_tngs",target:"c5_value",type:"informs",label:"Value drives selection among groups"},
  {source:"c5_reentry",target:"c6_dynamic_cat",type:"informs",label:"Reentry creates coherent categories"},
  {source:"c5_reentry",target:"c7_multimodal_unity",type:"informs",label:"Cross-modal binding via reentry"},
  {source:"c6_dynamic_cat",target:"c6_coupled_systems",type:"informs",label:"Category formation requires what/where coupling"},
  {source:"c7_context_memory",target:"c8_posture_specific",type:"informs",label:"Context-dependence predicts posture specificity"},
  {source:"c10_anb_meta",target:"c10_dynamic_field",type:"informs",label:"Task-variable effects motivate field model"}
];

// ═══════════════════════════════════════════════════════
// VISUALIZATION
// ═══════════════════════════════════════════════════════
const TYPE_COLORS = {concept:"#e8b84b",finding:"#2fc4af",rival:"#e85b6b",external:"#9b87f5",method:"#f0924a"};
const EDGE_COLORS = {challenges:"#e85b6b",extends:"#2fc4af",instantiates:"#e8b84b",informs:"#9b87f5"};
const svg = d3.select("#graph-svg");
const container = document.getElementById("graph-container");
let W, H, g, simulation;

// References panel
function buildRefPanel(){
  const el = document.getElementById("ref-list");
  const sorted = Object.entries(REFS).sort((a,b)=>a[1].apa.localeCompare(b[1].apa));
  el.innerHTML = sorted.map(([k,v])=>{
    const doiLink = v.doi ? ` <a href="${v.doi}" target="_blank" rel="noopener">${v.doi}</a>` : "";
    return `<div class="ref-entry" id="ref-${k}">${v.apa}${doiLink}</div>`;
  }).join("");
}
buildRefPanel();
document.getElementById("ref-toggle").onclick=()=>{document.getElementById("ref-panel").style.display="block"};
document.getElementById("ref-close").onclick=()=>{document.getElementById("ref-panel").style.display="none"};

function initGraph(){
  W = container.clientWidth;
  H = container.clientHeight;
  svg.selectAll("*").remove();
  g = svg.append("g");

  // Zoom
  const zoom = d3.zoom().scaleExtent([.2,5]).on("zoom",e=>g.attr("transform",e.transform));
  svg.call(zoom);
  svg.call(zoom.transform, d3.zoomIdentity.translate(W*.15,H*.1).scale(.7));

  // Arrowheads
  const defs = svg.append("defs");
  Object.entries(EDGE_COLORS).forEach(([t,c])=>{
    defs.append("marker").attr("id","arrow-"+t).attr("viewBox","0 0 10 6").attr("refX",22).attr("refY",3)
      .attr("markerWidth",8).attr("markerHeight",6).attr("orient","auto")
      .append("path").attr("d","M0,0L10,3L0,6Z").attr("fill",c).attr("opacity",.6);
  });

  // Force simulation
  simulation = d3.forceSimulation(NODES)
    .force("link",d3.forceLink(EDGES).id(d=>d.id).distance(d=>d.source.ch===d.target.ch?80:140).strength(.25))
    .force("charge",d3.forceManyBody().strength(-300).distanceMax(400))
    .force("center",d3.forceCenter(W/2,H/2).strength(.05))
    .force("collision",d3.forceCollide().radius(30))
    .force("x",d3.forceX(d=>{const s=.08;return W*(.1+.073*(d.ch-1))}).strength(.08))
    .force("y",d3.forceY(d=>{
      const m={concept:.4,finding:.6,rival:.25,external:.75,method:.5};
      return H*(m[d.type]||.5);
    }).strength(.06))
    .alphaDecay(.015);

  // Links
  const linkG = g.append("g");
  const links = linkG.selectAll("line").data(EDGES).join("line")
    .attr("stroke",d=>EDGE_COLORS[d.type]).attr("stroke-width",1.2).attr("stroke-opacity",.2)
    .attr("marker-end",d=>"url(#arrow-"+d.type+")");

  // Nodes
  const nodeG = g.append("g");
  const nodes = nodeG.selectAll("circle").data(NODES).join("circle")
    .attr("r",d=>d.type==="finding"?9:d.type==="rival"?8:d.type==="method"?8:7)
    .attr("fill",d=>TYPE_COLORS[d.type]).attr("stroke","#0a0a0f").attr("stroke-width",1.5)
    .attr("cursor","pointer").attr("opacity",.85);

  // Labels
  const labelG = g.append("g");
  const labels = labelG.selectAll("text").data(NODES).join("text")
    .text(d=>d.label).attr("font-size",10).attr("fill","#888").attr("font-family","'JetBrains Mono',monospace")
    .attr("text-anchor","middle").attr("dy",-14).attr("pointer-events","none");

  // Drag
  nodes.call(d3.drag().on("start",(e,d)=>{if(!e.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}));

  // Tooltip
  const tip = document.getElementById("tooltip");
  nodes.on("mouseover",(e,d)=>{
    tip.innerHTML=`<div class="tt-ch">Ch ${d.ch} · ${d.type}</div><div class="tt-title">${d.label}</div>`;
    tip.style.display="block";tip.style.left=(e.offsetX+12)+"px";tip.style.top=(e.offsetY-10)+"px";
  }).on("mousemove",(e)=>{tip.style.left=(e.offsetX+12)+"px";tip.style.top=(e.offsetY-10)+"px"})
    .on("mouseout",()=>{tip.style.display="none"});

  // Click: detail panel
  let selectedId = null;
  nodes.on("click",(e,d)=>{
    selectedId = d.id;
    showDetail(d);
    // Highlight neighborhood
    const neighbors = new Set();
    EDGES.forEach(edge=>{
      const s=typeof edge.source==="object"?edge.source.id:edge.source;
      const t=typeof edge.target==="object"?edge.target.id:edge.target;
      if(s===d.id){neighbors.add(t);neighbors.add(s)}
      if(t===d.id){neighbors.add(s);neighbors.add(t)}
    });
    nodes.transition().duration(300).attr("opacity",n=>neighbors.has(n.id)?.95:.15);
    labels.transition().duration(300).attr("fill",n=>neighbors.has(n.id)?"#e8e4d8":"#333");
    links.transition().duration(300).attr("stroke-opacity",edge=>{
      const s=typeof edge.source==="object"?edge.source.id:edge.source;
      const t=typeof edge.target==="object"?edge.target.id:edge.target;
      return (s===d.id||t===d.id)?.65:.04;
    });
  });

  svg.on("click",(e)=>{
    if(e.target.tagName==="svg"||e.target.tagName==="SVG"){
      selectedId=null;
      nodes.transition().duration(300).attr("opacity",.85);
      labels.transition().duration(300).attr("fill","#888");
      links.transition().duration(300).attr("stroke-opacity",.2);
    }
  });

  simulation.on("tick",()=>{
    links.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodes.attr("cx",d=>d.x).attr("cy",d=>d.y);
    labels.attr("x",d=>d.x).attr("y",d=>d.y);
  });

  // Stats
  document.getElementById("stats").textContent=`${NODES.length} nodes · ${EDGES.length} edges`;

  // Legend
  document.getElementById("legend").innerHTML=
    `<div style="margin-bottom:6px;color:#888;font-weight:600">Node Types</div>`+
    Object.entries(TYPE_COLORS).map(([t,c])=>`<div class="row"><span class="dot" style="background:${c}"></span>${t}</div>`).join("")+
    `<div style="margin:8px 0 6px;color:#888;font-weight:600">Edge Types</div>`+
    Object.entries(EDGE_COLORS).map(([t,c])=>`<div class="row"><span class="line" style="background:${c}"></span>${t}</div>`).join("");

  // Store references for filtering
  window._nodes=nodes; window._labels=labels; window._links=links;
  window._selectNode = (id)=>{
    const nd = NODES.find(n=>n.id===id);
    if(nd){nodes.filter(n=>n.id===id).dispatch("click")}
  };
}

// ═══════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════
function showDetail(node){
  const dp = document.getElementById("dp-content");
  const tc = TYPE_COLORS[node.type];
  let h = `<div class="dp-ch">Chapter ${node.ch}</div>`;
  h += `<div class="dp-title">${node.label}</div>`;
  h += `<div class="dp-type" style="background:${tc}22;color:${tc};border:1px solid ${tc}44">${node.type}</div>`;
  h += `<div class="dp-desc">${node.desc}</div>`;

  if(node.experimentDesign){
    const ed = node.experimentDesign;
    // Provenance badge
    const pClass = ed.sourceType==="verified"?"verified":ed.sourceType==="book"?"book":"training";
    const pLabel = ed.sourceType==="verified"?"✓ Verified from original paper":ed.sourceType==="book"?"◉ Reconstructed from book text":"△ Training knowledge";
    h += `<div class="dp-provenance ${pClass}">${pLabel}</div>`;
    h += `<div style="font-size:11px;color:#666;margin-bottom:10px;line-height:1.5">${ed.sourceNote}</div>`;

    // Short APA citations with DOI links
    if(ed.refs && ed.refs.length){
      h += `<div class="dp-cite">`;
      ed.refs.forEach((rk,i)=>{
        const ref = REFS[rk];
        if(ref){
          const link = ref.doi ? `<a href="${ref.doi}" target="_blank" rel="noopener">${ref.apa}</a>` : ref.apa;
          h += `<div style="margin-bottom:4px">${link}</div>`;
        }
      });
      h += `</div>`;
    }

    // Design fields
    const fields = [
      ["Participants",typeof ed.participants==="object"?`N = ${ed.participants.n}; Age: ${ed.participants.ageRange}; Design: ${ed.participants.design}`:ed.participants],
      ["IV",Array.isArray(ed.iv)?ed.iv.join("; "):ed.iv],
      ["DV",Array.isArray(ed.dv)?ed.dv.join("; "):ed.dv],
      ["Instruments",Array.isArray(ed.instruments)?ed.instruments.join("; "):ed.instruments],
      ["Procedure",ed.procedure],
      ["Trials",ed.trials],
      ["Analysis",ed.analysis],
      ["Key Result",ed.keyResult]
    ];
    h += `<div class="dp-section"><div class="dp-section-title">EXPERIMENT DESIGN</div>`;
    fields.forEach(([label,val])=>{
      if(val && val!=="N/A") h += `<div class="dp-field"><span class="dp-field-label">${label}:</span> <span class="dp-field-value">${val}</span></div>`;
    });
    h += `</div>`;
  }

  // Connections
  const conns = [];
  EDGES.forEach(edge=>{
    const s=typeof edge.source==="object"?edge.source.id:edge.source;
    const t=typeof edge.target==="object"?edge.target.id:edge.target;
    if(s===node.id){
      const tn=NODES.find(n=>n.id===t);
      if(tn) conns.push({id:t,label:tn.label,dir:"→",type:edge.type,edgeLabel:edge.label});
    }
    if(t===node.id){
      const sn=NODES.find(n=>n.id===s);
      if(sn) conns.push({id:s,label:sn.label,dir:"←",type:edge.type,edgeLabel:edge.label});
    }
  });
  if(conns.length){
    h += `<div class="dp-section"><div class="dp-section-title">CONNECTIONS (${conns.length})</div>`;
    conns.forEach(c=>{
      const ec = EDGE_COLORS[c.type];
      h += `<div class="dp-conn" onclick="window._selectNode('${c.id}')" title="${c.edgeLabel}">`;
      h += `<span style="color:${ec}">${c.dir} ${c.type}</span> ${c.label}`;
      h += `<div style="font-size:10px;color:#555;margin-left:16px">${c.edgeLabel}</div></div>`;
    });
    h += `</div>`;
  }
  dp.innerHTML = h;
}

// ═══════════════════════════════════════════════════════
// FILTERS + TIMELINE + SEARCH
// ═══════════════════════════════════════════════════════
let activeCh = "all";
const activeTypes = new Set(["concept","finding","rival","external","method"]);

function applyFilters(){
  const maxCh = parseInt(document.getElementById("timeline-slider").value);
  const query = document.getElementById("search-box").value.toLowerCase();
  NODES.forEach(n=>{
    const chOk = (activeCh==="all"||n.ch===parseInt(activeCh)) && n.ch<=maxCh;
    const typeOk = activeTypes.has(n.type);
    const searchOk = !query || n.label.toLowerCase().includes(query) || (n.desc&&n.desc.toLowerCase().includes(query));
    n._visible = chOk && typeOk && searchOk;
  });
  if(window._nodes){
    window._nodes.transition().duration(300).attr("opacity",d=>d._visible?.85:.06).attr("r",d=>d._visible?(d.type==="finding"?9:d.type==="rival"||d.type==="method"?8:7):3);
    window._labels.transition().duration(300).attr("fill",d=>d._visible?"#888":"transparent");
    window._links.transition().duration(300).attr("stroke-opacity",d=>{
      const s=typeof d.source==="object"?d.source:NODES.find(n=>n.id===d.source);
      const t=typeof d.target==="object"?d.target:NODES.find(n=>n.id===d.target);
      return (s&&s._visible&&t&&t._visible)?.2:.02;
    });
  }
}

document.querySelectorAll('.fbtn[data-ch]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fbtn[data-ch]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCh = btn.dataset.ch;
    applyFilters();
  });
});
document.querySelectorAll('.fbtn[data-type]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.classList.toggle('active');
    const t=btn.dataset.type;
    if(activeTypes.has(t))activeTypes.delete(t);else activeTypes.add(t);
    applyFilters();
  });
});
document.getElementById("timeline-slider").addEventListener("input",e=>{
  const v=e.target.value;
  document.getElementById("timeline-value").textContent=`Ch 1 — ${v}`;
  applyFilters();
});
document.getElementById("search-box").addEventListener("input",()=>applyFilters());

initGraph();
window.addEventListener("resize",()=>{initGraph();applyFilters()});
</script>
</body>
